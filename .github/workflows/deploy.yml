name: Zonyd CD (Deploy to AWS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PASO 1: Limpiar el .env en el runner de GitHub
      - name: Sanitize .env file on runner
        run: python3 sanitize_env.py
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # PASO 2: Preparar el servidor (git pull incremental, sin reinstalar paquetes del OS)
      - name: Setup server and pull code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            mkdir -p ~/zonyd-platform/backend
            cd ~/zonyd-platform
            if [ ! -d ".git" ]; then
              git clone https://github.com/keepsietapes/zonyd-platform .
            else
              git fetch origin
              git reset --hard origin/main
            fi
            echo "✅ Code updated successfully"

      # PASO 3: Copiar el .env limpio al servidor via SCP
      - name: Copy clean .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend_clean.env"
          target: "/home/ubuntu/zonyd-platform/backend/"

      # PASO 4: Renombrar .env y rebuild inteligente con Docker cache
      - name: Deploy Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # Renombrar el archivo que llego por SCP
            mv ~/zonyd-platform/backend/backend_clean.env ~/zonyd-platform/backend/.env
            echo "--- .env en servidor: $(wc -l < ~/zonyd-platform/backend/.env) lineas ---"

            # Instalar Docker solo si no existe (una sola vez)
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
            fi

            # Instalar docker-compose solo si no existe
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            cd ~/zonyd-platform

            # Diagnóstico y limpieza agresiva
            echo "--- Espacio en disco ANTES de la limpieza ---"
            df -h /
            
            # Limpiar contenedores detenidos, imágenes huérfanas y CACHE de build antigua
            sudo docker system prune -f
            sudo docker builder prune -f --filter "until=24h"
            
            echo "--- Espacio en disco DESPUÉS de la limpieza ---"
            df -h /
            
            # Build inteligente: usa cache de Docker layers
            sudo docker-compose -f docker-compose.prod.yml build --parallel
            sudo docker-compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            sleep 5
            sudo docker-compose -f docker-compose.prod.yml logs --tail=20 backend || true

            # Limpiar solo imagenes dangling e imagenes viejas para liberar espacio
            sudo docker image prune -f -a --filter "until=24h"

            echo "=== ✅ DEPLOY COMPLETADO EXITOSAMENTE ==="
