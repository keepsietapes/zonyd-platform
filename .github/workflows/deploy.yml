name: Zonyd CD (Deploy to AWS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            # Asegurar certificados de seguridad actualizados
            sudo apt-get update && sudo apt-get install -y ca-certificates git
            
            # Crear carpeta del proyecto si no existe
            mkdir -p ~/zonyd-platform
            cd ~/zonyd-platform
            
            # Si el repo no existe, clonarlo. Si existe, forzar actualización exacta
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }} .
            else
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi
            
            # Crear el archivo .env desde el secreto de GitHub
            echo "${{ secrets.ENV_FILE }}" > backend/.env
            
            # Asegurarse de que el archivo existe y tiene contenido
            ls -la backend/.env
            
            # Construir e iniciar los contenedores
            sudo docker-compose -f docker-compose.prod.yml up -d --build
            
            # Limpiar imágenes antiguas para no llenar el disco
            sudo docker image prune -f
