name: Zonyd CD (Deploy to AWS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PASO 1: Escribir el .env en el servidor usando printf (evita el problema de indentación del heredoc)
      - name: Write .env to server
        uses: appleboy/ssh-action@master
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: ENV_FILE
          script: |
            mkdir -p ~/zonyd-platform/backend
            printf '%s' "$ENV_FILE" > ~/zonyd-platform/backend/.env
            sed -i 's/\r$//' ~/zonyd-platform/backend/.env
            sed -i '/^[[:space:]]*$/d' ~/zonyd-platform/backend/.env
            sed -i '/^[[:space:]]*#/d' ~/zonyd-platform/backend/.env
            sed -i 's/="\(.*\)"$/=\1/' ~/zonyd-platform/backend/.env
            sed -i "s/='\(.*\)'$/=\1/" ~/zonyd-platform/backend/.env
            echo "--- .env escrito: $(wc -l < ~/zonyd-platform/backend/.env) lineas ---"

      # PASO 2: Actualizar codigo y levantar Docker
      - name: Deploy Docker to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            # Instalar dependencias del sistema
            sudo apt-get update && sudo apt-get install -y ca-certificates git curl

            # Instalar Docker si no existe
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
            fi

            # Instalar docker-compose si no existe
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Parar contenedores existentes y limpiar disco
            sudo docker-compose -f ~/zonyd-platform/docker-compose.prod.yml down --remove-orphans || true
            sudo docker system prune -af --volumes || true
            df -h /

            # Actualizar el codigo del repositorio
            cd ~/zonyd-platform
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }} .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # Verificar que el .env del paso anterior sigue ahi (git reset no lo borra porque esta en .gitignore)
            echo "--- Verificando .env antes de build ---"
            ls -la backend/.env
            wc -l backend/.env

            # Construir e iniciar contenedores
            sudo docker-compose -f docker-compose.prod.yml up -d --build

            sleep 5
            sudo docker-compose -f docker-compose.prod.yml logs --tail=50 backend || true
            sudo docker image prune -f

            echo "--- DEPLOY COMPLETADO EXITOSAMENTE ---"
