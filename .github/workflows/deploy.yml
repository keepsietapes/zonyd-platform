name: Zonyd CD (Deploy to AWS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PASO 1: Limpiar el .env en el runner de GitHub (no en SSH, sin problemas de YAML)
      - name: Sanitize .env file on runner
        run: python3 sanitize_env.py
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # PASO 2: Preparar el servidor (git clone/reset)
      - name: Setup server and pull code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            sudo apt-get update -qq && sudo apt-get install -y -qq ca-certificates git curl
            mkdir -p ~/zonyd-platform/backend
            cd ~/zonyd-platform
            if [ ! -d ".git" ]; then
              git clone https://github.com/keepsietapes/zonyd-platform .
            else
              git fetch origin
              git reset --hard origin/main
            fi
            echo "Code updated successfully"

      # PASO 3: Copiar el .env limpio al servidor via SCP (el metodo mas confiable)
      - name: Copy clean .env to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend_clean.env"
          target: "/home/ubuntu/zonyd-platform/backend/"

      # PASO 4: Renombrar .env y levantar Docker
      - name: Deploy Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            # Renombrar el archivo que llego por SCP
            mv ~/zonyd-platform/backend/backend_clean.env ~/zonyd-platform/backend/.env
            echo "--- .env en servidor: $(wc -l < ~/zonyd-platform/backend/.env) lineas ---"

            # Instalar Docker si no existe
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
            fi

            # Instalar docker-compose si no existe
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Limpiar contenedores e imagenes viejas
            sudo docker-compose -f ~/zonyd-platform/docker-compose.prod.yml down --remove-orphans || true
            sudo docker system prune -af --volumes || true
            df -h /

            # Construir y arrancar
            cd ~/zonyd-platform
            sudo docker-compose -f docker-compose.prod.yml up -d --build

            sleep 5
            sudo docker-compose -f docker-compose.prod.yml logs --tail=30 backend || true
            sudo docker image prune -f

            echo "=== DEPLOY COMPLETADO EXITOSAMENTE ==="
