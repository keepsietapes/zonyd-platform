name: Zonyd CD (Deploy to AWS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e # Abortar si cualquier comando falla
            
            # Asegurar certificados de seguridad actualizados
            sudo apt-get update && sudo apt-get install -y ca-certificates git
            
            # ── Limpieza agresiva de disco ──────────────────────────
            # Detener contenedores activos antes de limpiar
            sudo docker-compose -f docker-compose.prod.yml down --remove-orphans || true
            # Eliminar todos los contenedores, imágenes, volúmenes y cachés de build
            sudo docker system prune -af --volumes || true
            # Limpiar caché de npm acumulada en el host
            sudo rm -rf /root/.npm/_cacache || true
            sudo rm -rf /tmp/npm-* || true
            # Mostrar espacio disponible para verificar en los logs
            df -h /
            
            # Crear carpeta del proyecto si no existe
            mkdir -p ~/zonyd-platform
            cd ~/zonyd-platform
            
            # Si el repo no existe, clonarlo. Si existe, forzar actualización exacta
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }} .
            else
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi
            
            # Crear el archivo .env desde el secreto de GitHub de forma segura (preservando saltos de línea)
            cat << 'EOF' > backend/.env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # Quitar comillas dobles o simples de los valores (docker-compose no las quita y rompe las URLs)
            sed -i 's/="\(.*\)"$/=\1/' backend/.env
            sed -i "s/='\(.*\)'$/=\1/" backend/.env
            
            # Asegurarse de que el archivo existe y tiene contenido
            ls -la backend/.env
            
            # Construir e iniciar los contenedores
            sudo docker-compose -f docker-compose.prod.yml up -d --build
            
            # Esperar un poco para asegurar que el contenedor arrancó y no se cayó inmediatamente
            sleep 5
            
            # Imprimir los logs del backend en la consola de GitHub Actions para depurar si algo salió mal
            sudo docker-compose -f docker-compose.prod.yml logs backend || true
            
            # Limpiar imágenes antiguas para no llenar el disco
            sudo docker image prune -f
