name: Zonyd CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd backend && npm install
      - name: Generate Prisma
        run: cd backend && npx prisma generate
      - name: Run Tests
        run: cd backend && npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd zonyd-app && npm install
      - name: Build Next.js
        run: cd zonyd-app && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
